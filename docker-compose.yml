services:

  # ==========================================
  # POSTGRESQL
  # ==========================================

  postgres:
    image: postgres:17

    container_name: microservices-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - microservices-network


  # ==========================================
  # DISCOVERY SERVER
  # ==========================================

  discovery-server:
    build:
      context: ./discovery-server

    container_name: discovery-server

    ports:
      - "8761:8761"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    networks:
      - microservices-network


  # ==========================================
  # AUTH SERVICE
  # ==========================================

  auth-service:
    build:
      context: ./auth-service

    container_name: auth-service

    ports:
      - "8081:8081"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - postgres
      - discovery-server

    networks:
      - microservices-network


  # ==========================================
  # API GATEWAY
  # ==========================================

  api-gateway:
    build:
      context: ./api-gateway

    container_name: api-gateway

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

    depends_on:
      - discovery-server
      - auth-service

    networks:
      - microservices-network


# ==========================================
# VOLUMES
# ==========================================

volumes:

  postgres_data:


# ==========================================
# NETWORK
# ==========================================

networks:

  microservices-network:

    driver: bridge